<!doctype html>
<!--
  A0 — the renderer shell and the file loop's controls.

  The Content-Security-Policy below is a PLACEHOLDER, filled in at build time by
  scripts/render-renderer.mjs from contentSecurityPolicy() in the security
  contract. Do not paste a policy here.

  A hand-written copy would be a second declaration of the same rule, free to
  drift from the first — the failure that cost the cross-provider line three
  missed sites on 2026-08-23. dist/renderer/index.html is generated, never
  edited, and `npm run build:check` turns red if it is stale.

  Every workflow step A0 covers has a control here, because `ui-shell`'s
  acceptance row fails a step that needs an internal call.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <title>text-editor-basic</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="toolbar">
      <button id="new" type="button">New</button>
      <button id="open" type="button">Open</button>
      <button id="save" type="button">Save</button>
      <button id="save-as" type="button">Save As</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="cut" type="button">Cut</button>
      <button id="copy" type="button">Copy</button>
      <button id="paste" type="button">Paste</button>
      <label>Find <input id="find-query" type="text" /></label>
      <button id="find-next" type="button">Find Next</button>
      <label>Replace <input id="replace-query" type="text" /></label>
      <button id="replace" type="button">Replace</button>
      <span id="find-status" role="status" aria-live="polite"></span>
      <span id="dirty" data-dirty="false"><span id="name">untitled</span></span>
      <span id="status" data-busy="false">Electron <span id="version">unknown</span></span>
    </div>
    <!-- Announced politely so a refusal reaches a screen reader as well as the
         eye; error-report's row requires the name to reach the GUI, and a
         message only sighted users receive reaches only some of it. -->
    <p id="error" role="status" aria-live="polite"></p>
    <textarea id="document" spellcheck="false" aria-label="Document"></textarea>
    <script src="./editing-model.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
